<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Commerce Platform banner</title>
<style>
  :root{color-scheme:dark;--ink:#fff;--line:#6f7787}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:#000;color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
  h1{margin:0 0 4px;font-size:20px}
  p{margin:0 0 16px}
  .row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
  .cell{max-width:100%;min-width:0}
  .cell h2{margin:0 0 8px;font:500 12px/1.3 ui-monospace,Consolas,monospace}
  .cp-root{width:var(--w,1214px);max-width:100%}
  .cp-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:10px;font-size:12px;line-height:1.3}
  .cp-foot button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1.5px solid currentColor;border-radius:999px;background:transparent;color:inherit;font:inherit;font-weight:500;cursor:pointer}
  .ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18)}
  .ctl input[type=range]{width:min(420px,100%)}
  .ctl output{font:500 13px/1 ui-monospace,Consolas,monospace;min-width:5ch}
  .ctl button,.ctl select{min-height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:#0b0c10;color:inherit;font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid #b9f3ff;outline-offset:2px}
  .cp-root{container:cp/inline-size}.cp-stage{overflow:hidden;border-radius:16px;background:radial-gradient(70% 90% at 100% 100%,rgba(140,123,255,.42),rgba(140,123,255,0) 72%),radial-gradient(60% 90% at 0% 0%,rgba(47,107,255,.42),rgba(47,107,255,0) 72%),#000;box-shadow:inset 0 0 0 1px rgba(185,243,255,.24),0 0 56px -10px rgba(47,107,255,.65)}.cp-w,.cp-c{width:100%;height:auto;overflow:visible}.cp-w{display:block;aspect-ratio:1200/420}.cp-c{display:none;aspect-ratio:480/300}@container cp (max-width:899.98px){.cp-w{display:none}.cp-c{display:block;max-width:520px;margin:auto}}
</style>
</head>
<body>
<h1>Commerce Platform banner</h1>
<p>The same SVG and frame function as <code>CommercePreview.tsx</code>. Opens from disk with no dependencies. On the portfolio card it runs at 1214 px on a wide window, and at 246 to 276 px on a phone.</p>
<div class="row">
  <div class="cell"><h2 id="wa">1214 px</h2><div class="cp-root" id="a" style="--w:1214px" data-t="0"></div></div>
  <div class="cell"><h2>263 px</h2><div class="cp-root" id="b" style="--w:263px" data-t="0"></div></div>
</div>
<div class="ctl">
  <label for="width">Width</label>
  <select id="width">
    <option value="1214" selected>1214 px</option>
    <option value="970">970 px</option>
    <option value="781">781 px</option>
    <option value="480">480 px</option>
    <option value="276">276 px</option>
    <option value="246">246 px</option>
  </select>
  <label for="scrub">Scrub</label>
  <input id="scrub" type="range" min="0" max="12" step="0.05" value="0" />
  <output id="time" for="scrub">0.00 s</output>
  <button type="button" id="toggle">Pause</button>
  <label><input id="reduced" type="checkbox" /> Reduced motion</label>
  <label><input id="german" type="checkbox" /> Deutsch</label>
</div>
